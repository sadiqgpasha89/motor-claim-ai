services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: motorclaim
      POSTGRES_PASSWORD: motorclaim
      POSTGRES_DB: motorclaim
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U motorclaim"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    environment:
      DATABASE_URL: postgresql+psycopg://motorclaim:motorclaim@postgres:5432/motorclaim
      REDIS_URL: redis://redis:6379/0
      AI_PROVIDER_MODE: stub
      INTEGRATION_MODE: mock
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api
